<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .hero-pattern {
            background-color: #f6fafe;
            background-image: radial-gradient(#dfe3e7 0.5px, transparent 0.5px);

    body {
      min-height: max(884px, 100dvh);

<body class="bg-background text-on-background font-body-lg min-h-screen flex flex-col items-center hero-pattern">
<!-- Top Navigation Shell (Suppressed as per rules for transactional/onboarding screens, but here we manually render a simplified brand anchor) -->
<header class="w-full top-0 sticky flex justify-center items-center px-margin-mobile h-touch-target bg-surface/80 backdrop-blur-md z-50">
<h1 class="font-headline-lg-mobile text-headline-lg-mobile text-primary font-extrabold tracking-tight">VitalFlow</h1>
</header>
<main class="flex-1 w-full max-w-md px-margin-mobile flex flex-col justify-center items-center py-stack-lg">
<!-- Hero Visual Section -->
<div class="w-full flex flex-col items-center mb-stack-lg animate-in fade-in slide-in-from-bottom-4 duration-700">
<div class="relative w-48 h-48 mb-stack-md rounded-full overflow-hidden shadow-lg border-4 border-white">
<img class="w-full h-full object-cover" data-alt="A clean, medical-themed close-up of a glass blood storage container with professional studio lighting. The scene is bright and clinical, using a palette of sterile whites and soft grays, with the deep life-red of the liquid serving as a powerful focal point. The composition is minimalist and high-end, evoking a sense of urgent but calm healthcare efficiency." src="https://lh3.googleusercontent.com/aida-public/AB6AXuBAoruTLRcHi2CpSk8mQ5kBr3FHTsOLuNhqE6MnPNL9QSlu8_yVxIl13GA5XS3ylR8PTdvYivWovi89xdt4APamga-PUH1yRsLjshM6dgjNI5eU6K3Hccrb8RwUkusuERSN6L66BTrQzD_ZaD8jVg6IY87aOsJNiAt6dAfiWMX_LMhuDdNb7VjUy9x9n4DS7pFhzTLdRzJ3DSJSMRTN6PbIHQnAvk9vG13vwoxnLevf9rjjaMm0nJlR7MSHxzjpvwGGwIjuWH6ZKQon"/>
</div>
<div class="text-center">
<h2 class="font-headline-xl text-headline-xl text-on-surface mb-2">Welcome</h2>
<p class="font-body-lg text-body-lg text-on-surface-variant max-w-[280px]">Please select your preferred language to continue.</p>
</div>
</div>
<!-- Language Options Container -->
<div class="w-full space-y-stack-md">
<!-- English Button -->
<button class="group w-full h-[88px] flex items-center justify-between px-6 bg-surface-container-lowest border border-outline-variant rounded-xl shadow-sm hover:border-primary hover:bg-primary-fixed/30 transition-all duration-200 active:scale-[0.98]" onclick="selectLanguage('en')">
<div class="flex items-center gap-4">
<div class="w-12 h-12 rounded-lg bg-surface-container-high flex items-center justify-center text-primary group-hover:bg-primary group-hover:text-on-primary transition-colors">
<span class="material-symbols-outlined text-[28px]">language</span>
</div>
<div class="text-left">
<span class="block font-title-md text-title-md text-on-surface">English</span>
<span class="block font-label-md text-label-md text-on-surface-variant">Default Language</span>
</div>
</div>
<span class="material-symbols-outlined text-outline group-hover:text-primary transition-colors">chevron_right</span>
</button>
<!-- Nepali Button -->
<button class="group w-full h-[88px] flex items-center justify-between px-6 bg-surface-container-lowest border border-outline-variant rounded-xl shadow-sm hover:border-primary hover:bg-primary-fixed/30 transition-all duration-200 active:scale-[0.98]" onclick="selectLanguage('ne')">
<div class="flex items-center gap-4">
<div class="w-12 h-12 rounded-lg bg-surface-container-high flex items-center justify-center text-primary group-hover:bg-primary group-hover:text-on-primary transition-colors">
<span class="material-symbols-outlined text-[28px]" data-weight="fill" style="font-variation-settings: 'FILL' 1;">translate</span>
</div>
<div class="text-left">
<span class="block font-title-md text-title-md text-on-surface">नेपाली</span>
<span class="block font-nepali-body text-label-md text-on-surface-variant">स्थानीय भाषा</span>
</div>
</div>
<span class="material-symbols-outlined text-outline group-hover:text-primary transition-colors">chevron_right</span>
</button>
</div>
<!-- Bottom Assistance Text -->
<div class="mt-stack-lg text-center">
<p class="font-body-md text-body-md text-on-surface-variant opacity-60">
                You can change this anytime in settings.
            </p>
</div>
</main>
<!-- Success Modal (Hidden by default) -->
<div class="fixed inset-0 bg-on-surface/20 backdrop-blur-sm z-[100] flex items-center justify-center hidden" id="loading-overlay">
<div class="bg-surface p-8 rounded-2xl shadow-2xl flex flex-col items-center gap-4 animate-in zoom-in-95 duration-300">
<div class="w-12 h-12 border-4 border-primary border-t-transparent rounded-full animate-spin"></div>
<p class="font-title-md text-title-md text-primary">Setting things up...</p>
</div>
</div>
<script>
        function selectLanguage(lang) {
            const overlay = document.getElementById('loading-overlay');
            overlay.classList.remove('hidden');
            
            // Simulate navigation/logic delay
            setTimeout(() => {
                console.log('Language selected:', lang);
                // In a real app, we would route to the next onboarding step or home
                // window.location.href = '/onboarding';
                overlay.classList.add('hidden');
                alert(`Language set to ${lang === 'en' ? 'English' : 'नेपाली'}. Redirecting to dashboard...`);
            }, 1500);
        }

        // Add subtle hover tracking for interactive elements
        document.querySelectorAll('button').forEach(button => {
            button.addEventListener('mousemove', (e) => {
                const rect = button.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;
                button.style.setProperty('--mouse-x', `${x}px`);
                button.style.setProperty('--mouse-y', `${y}px`);
            });
        });
    </script>
</body></html>
